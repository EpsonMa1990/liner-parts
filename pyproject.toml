[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liner-parts"
version = "0.1.4"
description = "Local-first desktop parts-list maker for scale-model instruction manuals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "Flask>=3.1,<4", "waitress>=3,<4", "httpx>=0.28,<1",
  "pypdfium2>=4.30,<6", "Pillow>=11,<13", "openpyxl>=3.1,<4",
  "platformdirs>=4,<5", "keyring>=25,<26", "pywebview>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4,<5", "pyinstaller>=6,<7", "ruff>=0.12,<1"]

[project.scripts]
liner-parts = "liner_parts.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liner_parts = ["prompts/*.txt", "web_dist/*", "web_dist/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
